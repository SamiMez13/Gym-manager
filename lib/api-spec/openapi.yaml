components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # Branch
    Branch:
      type: object
      required: [id, name, address, phone, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        capacity:
          type: ["integer", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    BranchInput:
      type: object
      required: [name, address, phone]
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    BranchUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    # Trainer
    Trainer:
      type: object
      required: [id, firstName, lastName, email, specialization, branchId, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        specialization:
          type: string
        bio:
          type: ["string", "null"]
        branchId:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string

    TrainerInput:
      type: object
      required: [firstName, lastName, email, specialization, branchId]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        specialization:
          type: string
        bio:
          type: string
        branchId:
          type: integer
        isActive:
          type: boolean

    TrainerUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        specialization:
          type: string
        bio:
          type: string
        branchId:
          type: integer
        isActive:
          type: boolean

    # Member
    Member:
      type: object
      required: [id, firstName, lastName, email, phone, joinedAt, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        isActive:
          type: boolean
        joinedAt:
          type: string
        createdAt:
          type: string

    MemberInput:
      type: object
      required: [firstName, lastName, email, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
        address:
          type: string
        emergencyContact:
          type: string
        isActive:
          type: boolean

    MemberUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
        address:
          type: string
        emergencyContact:
          type: string
        isActive:
          type: boolean

    # GymClass
    GymClass:
      type: object
      required: [id, name, category, durationMinutes, maxCapacity, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        durationMinutes:
          type: integer
        maxCapacity:
          type: integer
        difficultyLevel:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string

    GymClassInput:
      type: object
      required: [name, category, durationMinutes, maxCapacity]
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        maxCapacity:
          type: integer
        difficultyLevel:
          type: string
        isActive:
          type: boolean

    GymClassUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        maxCapacity:
          type: integer
        difficultyLevel:
          type: string
        isActive:
          type: boolean

    # ClassSchedule
    ClassSchedule:
      type: object
      required: [id, classId, trainerId, branchId, startTime, endTime, currentBookings, createdAt]
      properties:
        id:
          type: integer
        classId:
          type: integer
        className:
          type: ["string", "null"]
        trainerId:
          type: integer
        trainerName:
          type: ["string", "null"]
        branchId:
          type: integer
        branchName:
          type: ["string", "null"]
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
        currentBookings:
          type: integer
        maxCapacity:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ClassScheduleInput:
      type: object
      required: [classId, trainerId, branchId, startTime, endTime]
      properties:
