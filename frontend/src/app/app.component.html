<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header class="ion-no-border">
        <ion-toolbar class="brand-toolbar">
          <ion-title>
            <span class="brand-mark">✦</span> GYM<span class="brand-accent">HUB</span>
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="menu-caption">OPERATIONS</div>
        <ion-list lines="none">
          <ion-menu-toggle autoHide="false" *ngFor="let item of navItems">
            <ion-item
              button
              detail="false"
              [routerLink]="item.path"
              routerLinkActive="active-nav"
              [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
            >
              <ion-icon [name]="item.icon" slot="start"></ion-icon>
              <ion-label>{{ item.label }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <div class="operator-card">
          <div class="operator-avatar">OP</div>
          <div>
            <strong>Operator</strong>
            <small>Admin access</small>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main-content">
      <ion-header class="mobile-header ion-no-border">
        <ion-toolbar class="brand-toolbar">
          <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
          </ion-buttons>
          <ion-title>Gym Hub</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-router-outlet id="main-content"></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
