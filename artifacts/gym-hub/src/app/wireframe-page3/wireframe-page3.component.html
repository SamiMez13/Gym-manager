<div class="wireframe-container">
    <div class="browser-chrome">
        <!-- Top Bar Wireframe -->
        <div class="top-bar">
            <div class="window-controls">
                <div class="control-btn"></div>
                <div class="control-btn"></div>
                <div class="control-btn"></div>
            </div>
            <div class="spacer"></div>
            <div class="logo-placeholder">[ acme.co ]</div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <h2 class="section-title">Growth Metrics</h2>
            <p class="section-desc">Visualizing the projected increase over Q3 / Q4.</p>

            <!-- Wireframe Chart Area -->
            <div class="chart-area">
                <!-- Chart Grid Lines -->
                <div class="grid-line" style="top: 20%;"></div>
                <div class="grid-line" style="top: 40%;"></div>
                <div class="grid-line" style="top: 60%;"></div>
                <div class="grid-line" style="top: 80%;"></div>

                <!-- Chart Bars -->
                <div class="chart-bar bar-1">
                    <div class="bar-label">Q1</div>
                </div>
                <div class="chart-bar bar-2">
                    <div class="bar-label">Q2</div>
                </div>
                <div class="chart-bar bar-3">
                    <div class="bar-label">Q3</div>
                </div>
                <div class="chart-bar bar-4">
                    <div class="bar-highlight">+120%</div>
                    <div class="bar-inner-label">Q4</div>
                </div>

                <!-- Fake cursor pointing to Q4 -->
                <div class="fake-cursor"></div>
            </div>
        </div>

        <!-- Footer Wireframe -->
        <div class="footer">
            <div>Example Company, Inc.</div>
            <div class="footer-right">
                <div>2026</div>
                <div>03</div>
            </div>
        </div>
    </div>
</div>
